<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ApexAudit // M&A Intelligence Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div class="app-container">
    <header class="terminal-header">
      <div class="brand">
        <span class="pulse-indicator"></span>
        <h1>APEX<span>AUDIT</span> <small>v2.4 // Enterprise Due Diligence</small></h1>
      </div>
      <div class="system-status">
        <span class="badge badge-success">ENGINE ACTIVE</span>
        <span class="badge badge-outline">RENDER LIVE</span>
      </div>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-title">TARGET ENTITY</span>
        <div class="metric-value">ACME CORP (10-K)</div>
      </div>
      <div class="metric-card">
        <span class="metric-title">AUDIT COMPLIANCE</span>
        <div class="metric-value highlight-green">VERIFIED</div>
      </div>
      <div class="metric-card">
        <span class="metric-title">RISK FACTOR INDEX</span>
        <div class="metric-value highlight-amber" id="riskIndexVal">LOW</div>
      </div>
    </div>

    <main class="terminal-body">
      <section class="console-section">
        <div class="section-header">
          <h2>FORENSIC QUERY CONSOLE</h2>
        </div>
        <div class="query-box">
          <input type="text" id="queryInput" placeholder="Ask financial question (e.g., What are the key revenue risks and compliance disclosures?)..." />
          <button id="submitBtn" onclick="runAuditQuery()">RUN AUDIT</button>
        </div>

        <div class="audit-response-card" id="responseCard" style="display:none;">
          <div class="card-top">
            <span class="verdict-badge" id="verdictBadge">VERIFIED CITATION</span>
            <span class="page-tag" id="pageTag">Page --</span>
          </div>
          <div class="response-text" id="responseText"></div>
          <div class="citation-box">
            <strong>GROUNDED EVIDENCE SNIPPET:</strong>
            <p id="snippetText"></p>
          </div>
        </div>
      </section>

      <section class="analytics-section">
        <div class="section-header">
          <h2>VISUAL RISK & REVENUE ANALYTICS</h2>
        </div>
        <div class="chart-container">
          <canvas id="riskChart"></canvas>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
